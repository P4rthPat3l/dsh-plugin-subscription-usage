<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscriptions in Models: UI draft v3</title>
<style>
/* Host theme tokens, resolved from @deepseek-ai/dsh-client-ui-theme 0.2.2-rc.1. */
:root[data-theme="dark"] {
  --bg-base: #151517; --bg-layer-1: #232324; --bg-layer-2: #2c2c2e; --bg-overlay: #2a2a2c;
  --card-fill: #1d1d1f; --card-stroke: #ffffff1f;
  --border-l1: #ffffff0f; --border-l2: #ffffff1f; --border-l3: #ffffff2e;
  --label-primary: #f9fafb; --label-secondary: #cfd3d6; --label-tertiary: #9aa0a6;
  --success: #22c55e; --warn: #f59e0b; --error: #f25a5a; --idle: #545557; --business: #7aaaff;
  --hover: #ffffff0f; --track: #ffffff17; --shadow: 0 12px 32px #00000066, 0 2px 6px #00000040;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg-base: #ffffff; --bg-layer-1: #ffffff; --bg-layer-2: #f4f5f7; --bg-overlay: #ffffff;
  --card-fill: #f9fafb; --card-stroke: #0000001a;
  --border-l1: #0000000a; --border-l2: #0000001a; --border-l3: #00000029;
  --label-primary: #0f1115; --label-secondary: #61666b; --label-tertiary: #80868b;
  --success: #16a34a; --warn: #c27803; --error: #dc2626; --idle: #a3a3a3; --business: #4176e6;
  --hover: #0000000a; --track: #00000012; --shadow: 0 12px 32px #0f11151f, 0 2px 6px #0f111514;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg-base); color: var(--label-primary);
  font: 14px/22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", system-ui, sans-serif; }
::selection { background: color-mix(in srgb, var(--business) 35%, transparent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--business); border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 14px; height: 14px; flex: none; display: block; }
svg.i.sm { width: 12px; height: 12px; }

/* Draft chrome, not part of the design. */
.draftbar { position: sticky; top: 0; z-index: 60; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  padding: 9px 24px; background: var(--bg-layer-2); border-bottom: .5px solid var(--border-l2); font-size: 12px; line-height: 18px; }
.draftbar b { font-weight: 600; }
.draftbar label { display: inline-flex; gap: 6px; align-items: center; color: var(--label-secondary); }
.draftbar select { font: inherit; color: var(--label-primary); background: var(--bg-layer-1); border: .5px solid var(--border-l3); border-radius: 6px; padding: 2px 6px; }
.owned [data-slot] { outline: 1px dashed var(--business); outline-offset: 3px; border-radius: 8px; position: relative; }
.owned [data-slot]::before { content: attr(data-slot); position: absolute; top: -10px; right: 6px; font-size: 10px; line-height: 14px;
  padding: 0 5px; border-radius: 4px; background: var(--business); color: #0f1115; z-index: 2; white-space: nowrap; }

/* Shell approximation. */
.shell { display: grid; grid-template-columns: 200px 1fr; min-height: calc(100vh - 37px); }
.nav { border-right: .5px solid var(--border-l1); padding: 20px 10px; display: flex; flex-direction: column; gap: 2px; background: var(--bg-layer-1); }
.nav a { padding: 6px 10px; border-radius: 8px; color: var(--label-secondary); text-decoration: none; font-size: 13px; }
.nav a[aria-current] { background: var(--hover); color: var(--label-primary); }
.content { padding: 28px 40px 170px; }
.hero { display: none; }
body.view-hero .content { display: none; }
body.view-hero .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 24px 80px; min-height: calc(100vh - 37px); }
.hero h1 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 500; letter-spacing: -.01em; }
#heroComposerSlot { width: min(720px, 100%); display: flex; flex-direction: column; gap: 6px; }
.heroRow { display: flex; align-items: center; gap: 4px; padding: 0 8px 0 12px; }
.heroRow .pill { height: 28px; padding: 0 8px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--label-secondary); }
.heroRow .opts { margin-left: auto; display: flex; align-items: center; position: relative; }

/* Models section, copied from dsh-client-ui-settings-models. */
.section { max-width: 720px; display: flex; flex-direction: column; gap: 12px; }
.title { margin: 0; font-size: 16px; font-weight: 500; line-height: 24px; }
.intro { margin: 0; color: var(--label-tertiary); }
.rows { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rowCard { border: .5px solid var(--card-stroke); background: var(--card-fill); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.rowHead { display: flex; align-items: center; gap: 10px; }
.rowIdentity { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.rowName { font-size: 14px; font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.ok { background: var(--success); } .dot.missing { background: var(--error); }
.rowActions { margin-left: auto; display: inline-flex; gap: 4px; align-items: center; }
.btn { height: 28px; padding: 0 10px; border-radius: 6px; font-size: 12px; line-height: 18px; cursor: pointer;
  border: .5px solid var(--border-l3); background: transparent; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--label-primary); color: var(--bg-base); border-color: transparent; }
.btn.ghost { border-color: transparent; color: var(--label-secondary); }
.btn.danger { border-color: transparent; color: var(--error); }
.btn.icon { width: 28px; padding: 0; justify-content: center; border-color: transparent; color: var(--label-secondary); }
.btn.icon.sm { width: 24px; height: 24px; }
.addButton { height: 44px; border: 1px dashed var(--border-l3); border-radius: 12px; background: transparent; color: var(--label-primary); cursor: pointer; }

/* Plugin card body. */
.sub { display: flex; flex-direction: column; gap: 8px; }
.acctHead { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; line-height: 20px; color: var(--label-secondary); }
.acctName { color: var(--label-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tag { flex: none; font-size: 11px; line-height: 16px; padding: 0 5px; border-radius: 4px; border: .5px solid var(--border-l3); color: var(--label-secondary); }
.glyph { display: inline-flex; color: var(--label-tertiary); flex: none; }
.glyph.star { color: var(--warn); }
.glyph.live { color: var(--business); }
.fresh { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--label-tertiary); white-space: nowrap; flex: none; }
.fresh.stale { color: var(--warn); }
.liveDot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

/* One window = one row on a fixed grid: label | bar | value | time. Every row on the page shares these columns. */
.wins { display: flex; flex-direction: column; gap: 6px; }
.w { display: grid; grid-template-columns: var(--c-label, 52px) minmax(0, 1fr) 44px var(--c-time, 92px); align-items: center; gap: 12px; font-size: 12px; line-height: 18px; }
.w .wl { color: var(--label-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w .wv { text-align: right; font-weight: 600; font-size: 13px; color: var(--label-primary); }
.w .wt { text-align: right; color: var(--label-tertiary); white-space: nowrap; }
.w.tight .wv, .w.tight .wt { color: var(--warn); }
.w.over .wv, .w.over .wt, .w.out .wv, .w.out .wt { color: var(--error); }

/* Bar: fill is the quota, tick is the time, hatch is the forecast. */
.bar { position: relative; height: 6px; border-radius: 3px; background: var(--track); color: var(--success); }
.bar .fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 3px; background: currentColor; transition: width .5s cubic-bezier(.16,1,.3,1); }
.bar .proj { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, transparent 0 2px, color-mix(in srgb, currentColor 55%, transparent) 2px 3px); }
.bar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--label-primary); opacity: .8; }
.bar.tight { color: var(--warn); } .bar.over, .bar.out { color: var(--error); }

/* Collapsed summary row: chevron | name | 5h mini | 7d mini. */
.fold { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 0 6px 0 2px;
  border: 0; background: none; text-align: left; cursor: pointer; border-radius: 8px; font-size: 12px; color: var(--label-secondary); }
.fold:hover { background: var(--hover); }
.fold .chev { color: var(--label-tertiary); transition: transform .2s cubic-bezier(.16,1,.3,1); }
.fold[aria-expanded="true"] .chev { transform: rotate(90deg); }
.fold .fn { display: flex; align-items: center; gap: 6px; min-width: 0; }
.fold .fn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.minis { display: flex; gap: 14px; }
.mini { display: grid; grid-template-columns: 18px 32px 34px; align-items: center; gap: 5px; font-size: 11px; }
.mini i { font-style: normal; color: var(--label-tertiary); }
.mini .bar { height: 4px; }
.mini .bar .tick { top: -2px; bottom: -2px; width: 1.5px; }
.mini b { font-weight: 500; text-align: right; color: var(--label-primary); font-size: 12px; }
.mini.tight b { color: var(--warn); } .mini.over b, .mini.out b { color: var(--error); }
.foldBody { display: flex; flex-direction: column; gap: 8px; padding: 2px 0 4px 24px; }
.foldBody[hidden] { display: none; }

.subFoot { display: flex; align-items: center; gap: 6px; }
.muted { color: var(--label-tertiary); font-size: 12px; line-height: 18px; margin: 0; display: inline-flex; align-items: center; gap: 6px; }
.alert { display: flex; gap: 8px; align-items: center; padding: 6px 6px 6px 10px; border-radius: 10px; font-size: 13px; line-height: 20px;
  background: color-mix(in srgb, var(--error) 10%, transparent); }
.alert > svg { color: var(--error); }
.alert .btn { margin-left: auto; }

/* Inline manager. */
.manage { border-radius: 12px; background: var(--bg-layer-2); padding: 2px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.tabs { display: flex; gap: 2px; border-bottom: .5px solid var(--border-l2); margin: 0 -12px; padding: 0 8px; }
.tab { border: 0; background: none; padding: 9px 8px 8px; font-size: 13px; color: var(--label-tertiary); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -.5px; }
.tab[aria-selected="true"] { color: var(--label-primary); border-bottom-color: var(--label-primary); }
.mrow { display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 13px; }
.mrow + .mrow { border-top: .5px solid var(--border-l1); }
.mrow .grow { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
.mrow .note { color: var(--label-tertiary); font-size: 12px; }
.switch { width: 30px; height: 18px; border-radius: 9px; background: var(--idle); border: 0; position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .2s cubic-bezier(.16,1,.3,1); }
.switch[aria-checked="true"] { background: var(--success); }
.switch[aria-checked="true"]::after { transform: translateX(12px); }
.input { height: 30px; width: 100%; border-radius: 8px; border: .5px solid var(--border-l3); background: var(--bg-layer-1); color: var(--label-primary); padding: 0 10px; font: inherit; font-size: 13px; }
.selectSm { height: 26px; border-radius: 6px; border: .5px solid var(--border-l3); background: var(--bg-layer-1); color: var(--label-primary); font: inherit; font-size: 12px; padding: 0 4px; }
.mfoot { display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px; }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--track); gap: 2px; flex: none; }
.seg button { border: 0; background: transparent; height: 22px; padding: 0 9px; border-radius: 5px; font-size: 12px; color: var(--label-secondary); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--bg-layer-1); color: var(--label-primary); box-shadow: 0 1px 2px #0000002e; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 26px; padding: 0 10px 0 8px; border-radius: 13px; border: .5px solid var(--border-l3); background: transparent; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; color: var(--label-secondary); }
.chip[aria-pressed="true"] { background: var(--label-primary); color: var(--bg-base); border-color: transparent; }
.chip:disabled { opacity: .45; cursor: default; }

/* Sign-in. */
.signin { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--bg-layer-2); }
.steps { display: flex; gap: 16px; margin: 0; padding: 0; list-style: none; font-size: 12px; flex-wrap: wrap; }
.steps li { display: inline-flex; gap: 6px; align-items: center; color: var(--label-tertiary); }
.steps li[data-s="done"] { color: var(--success); }
.steps li[data-s="now"] { color: var(--label-primary); }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--border-l3); border-top-color: currentColor; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinning svg { animation: spin .7s linear infinite; }
.code { font: 600 20px/28px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .12em; padding: 4px 12px; border-radius: 8px; background: var(--bg-layer-1); border: .5px solid var(--border-l2); }
details.fallback summary { cursor: pointer; color: var(--label-tertiary); font-size: 12px; list-style: none; display: inline-flex; gap: 4px; align-items: center; }
details.fallback[open] summary { margin-bottom: 6px; }

/* Footer options. */
.footerBlock { margin-top: 18px; padding-top: 14px; border-top: .5px solid var(--border-l2); display: flex; flex-direction: column; }
.footerBlock h3 { margin: 0 0 4px; font-size: 14px; font-weight: 500; }
.footerBlock .mrow { min-height: 40px; }

/* Composer and its dock. */
.composerWrap { position: fixed; left: 200px; right: 0; bottom: 0; padding: 0 40px 12px; background: linear-gradient(to top, var(--bg-base) 70%, transparent); z-index: 20; }
body.view-hero .composerWrap { position: static; padding: 0; background: none; }
.composer { max-width: 760px; margin: 0 auto; }
.composerCard { border: .5px solid var(--border-l2); border-radius: 18px; background: var(--bg-layer-1); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
body.view-hero .composerCard { min-height: 116px; justify-content: space-between; }
.composerCard .ph { color: var(--label-tertiary); }
.composerTools { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--label-secondary); }
.dock { display: flex; justify-content: center; align-items: center; gap: 12px; padding-top: 8px; font-size: 12px; line-height: 18px; color: var(--label-tertiary); position: relative; }
body.view-hero .dock { display: none; }

.gaugeSlot { position: relative; display: inline-flex; }
.gauge { display: inline-flex; align-items: center; gap: 10px; height: 26px; padding: 0 10px; border-radius: 13px; border: 0; background: transparent; cursor: pointer; color: var(--label-secondary); font-size: 12px; }
.gauge:hover, .gauge[aria-expanded="true"] { background: var(--hover); }
.gp { display: inline-flex; align-items: center; gap: 8px; }
.gp + .gp { padding-left: 10px; border-left: .5px solid var(--border-l3); }
.gp .gn { color: var(--label-primary); }
.gp .minis { gap: 10px; }
.gp .mini { grid-template-columns: auto 26px auto; }

/* Popover: same row grid as Settings, narrower columns. */
.pop { position: absolute; bottom: 34px; left: 50%; width: 420px; max-width: calc(100vw - 20px); transform: translateX(-50%); background: var(--bg-overlay); border-radius: 14px;
  box-shadow: var(--shadow); border: .5px solid var(--border-l2); padding: 6px; display: flex; flex-direction: column; color: var(--label-primary); text-align: left; z-index: 30;
  --c-label: 48px; --c-time: 96px; }
.pop.below { bottom: auto; top: 34px; }
.pop[hidden] { display: none; }
.popHead { display: flex; align-items: center; gap: 2px; padding: 2px 2px 6px 8px; }
.popHead b { font-weight: 600; font-size: 13px; margin-right: auto; }
.psec { border-top: .5px solid var(--border-l2); padding: 4px 0; }
.psec .foldBody { padding: 0 8px 6px 26px; gap: 6px; }
.psec .foldBody .foldBody { padding: 4px 0 0; }
.psec .foldBody .fold { margin-left: -24px; width: calc(100% + 24px); }
.pacct { display: flex; flex-direction: column; gap: 4px; }
.pacct + .pacct { padding-top: 6px; border-top: .5px solid var(--border-l1); }
.pacct .acctHead { font-size: 12px; line-height: 18px; }
.more { border: 0; background: none; padding: 2px 0; font-size: 12px; color: var(--label-tertiary); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; border-radius: 4px; }
.more:hover { color: var(--label-primary); }
.more .chev { transition: transform .2s cubic-bezier(.16,1,.3,1); }
.more[aria-expanded="true"] .chev { transform: rotate(90deg); }
.pin { color: var(--label-tertiary); }
.pin[aria-pressed="true"] { color: var(--label-primary); }

/* Frame-wide notice. */
.notice { position: fixed; top: 50px; right: 20px; z-index: 50; background: var(--bg-overlay); border-radius: 12px; box-shadow: var(--shadow); border: .5px solid var(--border-l2);
  padding: 6px 6px 6px 12px; display: flex; gap: 8px; align-items: center; font-size: 13px; line-height: 20px; animation: drop .45s cubic-bezier(.16,1,.3,1); max-width: calc(100vw - 40px); }
.notice[hidden] { display: none; }
.notice > svg { color: var(--warn); }
.notice.err > svg { color: var(--error); }
@keyframes drop { from { opacity: 0; transform: translateY(-8px); filter: blur(4px); } }

[data-tip] { position: relative; }
[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: var(--label-primary); color: var(--bg-base); font-size: 11px; line-height: 15px; padding: 4px 7px; border-radius: 5px; white-space: pre; z-index: 80; pointer-events: none; font-weight: 400; }

@media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; } .nav { display: none; } .content { padding: 20px 14px 180px; }
  .composerWrap { left: 0; padding: 0 10px 10px; }
  .w, .pop { --c-label: 30px; --c-time: 98px; }
  .w { gap: 8px; grid-template-columns: var(--c-label) minmax(0, 1fr) 38px var(--c-time); }
  .minis { gap: 8px; } .mini { grid-template-columns: 16px 22px 32px; }
  .gp .gn { display: none; }
  .notice { left: 10px; right: 10px; top: 132px; }
  .footerBlock .mrow { flex-wrap: wrap; padding: 6px 0; }
}
</style>
</head>
<body>
<div class="draftbar" role="region" aria-label="Draft controls">
  <b>Draft v3</b>
  <label>View <select id="view"><option value="settings">Settings + chat</option><option value="hero">New session, nothing typed</option></select></label>
  <label>Scenario
    <select id="scenario">
      <option value="typical">Typical day</option>
      <option value="pressure">Codex running hot</option>
      <option value="exhausted">Claude weekly exhausted</option>
      <option value="reauth">Copilot sign-in expired</option>
      <option value="first">First run</option>
    </select>
  </label>
  <label>Theme <select id="theme"><option>dark</option><option>light</option></select></label>
  <label><input type="checkbox" id="owned"> Plugin areas</label>
  <span style="color:var(--label-tertiary)">Values are illustrative.</span>
</div>

<div class="shell">
  <nav class="nav" aria-label="Settings">
    <a href="#">General</a><a href="#" aria-current="page">Models</a><a href="#">Agent</a><a href="#">Plugins</a><a href="#">Shell</a>
  </nav>
  <div>
    <main class="content">
      <section class="section" aria-labelledby="models-title">
        <h2 class="title" id="models-title">Models</h2>
        <p class="intro">Enter your API keys to use models from the following providers.</p>
        <ul class="rows" id="rows"></ul>
        <button class="addButton" type="button">+ Add model provider</button>
        <div id="footer" data-slot="settings.models.footer"></div>
      </section>
    </main>
    <div class="hero">
      <h1>What should we work on?</h1>
      <div id="heroComposerSlot">
        <div id="heroComposerHolder"></div>
        <div class="heroRow">
          <span class="pill">default-workspace</span><span class="pill">Standard preset</span>
          <span class="opts" id="heroOpts" data-slot="conversation.hero.options"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="notice" id="notice" role="status" aria-live="polite" hidden data-slot="shell.quota-notice"></div>

<div class="composerWrap" id="composerWrap">
  <div class="composer">
    <div class="composerCard">
      <span class="ph">Send a message or create a task</span>
      <div class="composerTools"><span>Full access</span><span style="margin-left:auto" id="modelLabel"></span></div>
    </div>
    <div class="dock">
      <span>4 turns · 68 tok/s</span>
      <span id="dockOpts" data-slot="conversation.composer.dock"></span>
    </div>
  </div>
</div>

<script>
const H = 3600e3, D = 24 * H, NOW = Date.parse('2026-11-08T17:30:00+05:30')

const P = {

/* Pace: compare quota used with time elapsed; forecast only after 20% of the window. */
function pace(w) {
  if (w.used == null) return { state: 'unknown' }
  const left = Math.max(0, 100 - w.used)
  if (w.used >= 100) return { state: 'out', left: 0 }
  if (!w.duration || !w.resetsAt) return { state: 'calm', left }
  const elapsed = Math.min(1, Math.max(0, 1 - (w.resetsAt - NOW) / w.duration))
  if (elapsed < 0.2 || w.used < 3) return { state: 'calm', left, elapsed }
  const projected = w.used / elapsed
  const runsOutIn = left / (w.used / (elapsed * w.duration))
  if (projected > 100) return { state: 'over', left, elapsed, projected, outAt: NOW + runsOutIn }
  if (projected > 85) return { state: 'tight', left, elapsed, projected }
  return { state: 'calm', left, elapsed, projected }
}
const dur = ms => {
  const d = Math.floor(ms / D), h = Math.floor(ms % D / H), m = Math.round(ms % H / 60e3)
  if (d) return h ? `${d}d ${h}h` : `${d}d`
  if (h) return m ? `${h}h ${m}m` : `${h}h`
  return `${Math.max(1, m)}m`
}
const clockAt = t => {
  const d = new Date(t), time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
  return d.toDateString() === new Date(NOW).toDateString() ? time : `${d.toLocaleDateString('en-GB', { weekday: 'short' })} ${time}`
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const label = w => (w.kind === 'session' ? '5h' : '7d') + (w.scope ? ' ' + w.scope : '')

function barHTML(w, p) {
  const used = Math.min(100, w.used ?? 0)
  const leftMode = ui.display === 'left'
  const fill = leftMode ? 100 - used : used
  let proj = ''
  if (p.state === 'over' || p.state === 'tight') {
    const end = Math.min(100, p.projected)
    proj = leftMode ? `<span class="proj" style="left:${100 - end}%;width:${end - used}%"></span>` : `<span class="proj" style="left:${used}%;width:${end - used}%"></span>`
  }
  const tick = p.elapsed != null ? `<span class="tick" style="left:${(leftMode ? 1 - p.elapsed : p.elapsed) * 100}%"></span>` : ''
  return `<span class="bar ${p.state}" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${fill}"><span class="fill" style="width:${fill}%"></span>${proj}${tick}</span>`
}
const valueOf = p => p.state === 'unknown' ? '–' : (ui.display === 'left' ? p.left : 100 - p.left) + '%'
/* The time column always answers "when does this change": reset, empty, or back. */
function timeOf(w, p) {
  if (p.state === 'out') return `back ${clockAt(w.resetsAt)}`
  if (p.state === 'over') return `empty ${clockAt(p.outAt)}`
  return w.resetsAt ? `in ${dur(w.resetsAt - NOW)}` : ''
}
function tipFor(w, p) {
  if (p.state === 'unknown') return 'Not reported'
  const lines = [`${100 - p.left}% used · ${p.left}% left`]
  if (p.elapsed != null) lines.push(`Tick: ${Math.round(p.elapsed * 100)}% of the window passed`)
  if (p.state === 'tight') lines.push(`Pace: ~${Math.round(p.projected)}% by reset`)
  if (w.resetsAt) lines.push(`Resets ${clockAt(w.resetsAt)}`)
  return lines.join('\n')
}
function winRow(w) {
  const p = pace(w)
  return `<div class="w ${p.state}" data-tip="${esc(tipFor(w, p))}"><span class="wl">${label(w)}</span>${barHTML(w, p)}<span class="wv num">${valueOf(p)}</span><span class="wt num">${timeOf(w, p)}</span></div>`
}
function mini(w) {
  const p = pace(w)
  return `<span class="mini ${p.state}"><i>${w.kind === 'session' ? '5h' : '7d'}</i>${barHTML(w, p)}<b class="num">${valueOf(p)}</b></span>`
}
const minis = a => a.windows ? `<span class="minis">${a.windows.filter(w => !w.scope).map(mini).join('')}</span>` : ''

/* A folded account list: the active account in full, the rest behind one summary row with mini bars. */
function moreAccounts(p, key, compact) {

  if (rest.length === 1) return `<button class="fold" aria-expanded="${open}" data-fold="${key}" style="grid-template-columns:minmax(0,1fr) auto">${summary}</button><div class="foldBody" ${open ? '' : 'hidden'}>${body}</div>`

  renderGauge()
}

const toggle = (set, k) => set.has(k) ? set.delete(k) : set.add(k)
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab],[data-set],[data-pin],[data-fold],[data-sec],#gauge,.switch:not([data-act])')
  if (!t) { if (ui.popOpen && !e.target.closest('#pop')) { ui.popOpen = false; renderGauge() } return }
  if (t.id === 'gauge') {
    ui.popOpen = !ui.popOpen; ui.popOpenSecs = null
    if (ui.popOpen && !ui.refreshedAt) { ui.refreshing = true; setTimeout(() => { ui.refreshing = false; renderGauge() }, 600) }
    renderGauge(); return
  }
  if (t.dataset.fold) { toggle(ui.open, t.dataset.fold); t.closest('#pop') ? renderGauge() : render(); return }
  if (t.dataset.sec) { toggle(ui.popOpenSecs, t.dataset.sec); renderGauge(); return }
  if (t.dataset.set) { ui[t.dataset.set] = t.dataset.v; render(); return }
  if (t.dataset.pin) { toggle(ui.pinned, t.dataset.pin); if (ui.gaugeMode === 'current') ui.gaugeMode = 'pinned'; render(); return }
  if (t.dataset.tab) { ui.tab = t.dataset.tab; render(); return }
  if (t.classList.contains('switch') && !t.dataset.act) { t.setAttribute('aria-checked', String(t.getAttribute('aria-checked') !== 'true')); return }
  const act = t.dataset.act
  if (act === 'refresh') {
    ui.refreshing = true; renderGauge()
    setTimeout(() => { ui.refreshing = false; ui.refreshedAt = NOW; ui.cooldownUntil = performance.now() + 30e3; render(); setTimeout(renderGauge, 30e3) }, 700)
    return
  }
  if (act === 'openSettings') { ui.popOpen = false; ui.view = 'settings'; document.getElementById('view').value = 'settings'; render(); document.querySelector('.footerBlock').scrollIntoView({ behavior: 'smooth', block: 'center' }); return }
  if (act === 'warnings') { ui.warnings = !ui.warnings; render(); return }
  if (act === 'manage') { ui.manage = t.dataset.p; ui.tab = 'accounts'; ui.signin = null }
  if (act === 'close') ui.manage = null
  if (act === 'signin') { ui.signin = t.dataset.p; ui.manage = null }
  if (act === 'cancel') ui.signin = null
  if (act === 'dismiss') ui.noticeHidden = true
  render()
})
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.popOpen) { ui.popOpen = false; renderGauge(); document.getElementById('gauge')?.focus() } })
document.getElementById('scenario').onchange = () => { Object.assign(ui, { manage: null, signin: null, noticeHidden: false, refreshedAt: null, popOpen: false }); render() }
document.getElementById('view').onchange = e => { ui.view = e.target.value; ui.popOpen = false; render() }
document.getElementById('theme').onchange = e => { document.documentElement.dataset.theme = e.target.value }
document.getElementById('owned').onchange = e => document.body.classList.toggle('owned', e.target.checked)
render()
</script>
</body>
</html>
